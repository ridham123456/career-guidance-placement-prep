<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | MargDarshi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="public-header">
    <div class="public-container">
      <nav class="public-nav">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">🎓</div>
          <span>MargDarshi</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html" class="btn btn-secondary btn-sm">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="badge badge-blue" style="margin-bottom: 8px;">Societal Internship Demo</span>
        <h1>Student Registration</h1>
        <p>Create your student profile to access placement preparation modules.</p>
      </div>

      <div id="alertBox" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">College / Personal Email</label>
          <input type="email" id="email" class="form-control" placeholder="rahul.sharma@college.edu" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="branch">Branch</label>
            <select id="branch" class="form-control" required>
              <option value="Computer Science & Engineering">Computer Science & Engg (CSE)</option>
              <option value="Information Science & Engineering">Information Science (ISE)</option>
              <option value="Electronics & Communication">Electronics & Comm (ECE)</option>
              <option value="Electrical & Electronics">Electrical & Electronics (EEE)</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Information Technology">Information Technology (IT)</option>
              <option value="Artificial Intelligence & Data Science">AI & Data Science (AI/DS)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="semester">Current Semester</label>
            <select id="semester" class="form-control" required>
              <option value="3rd Semester">3rd Semester</option>
              <option value="4th Semester">4th Semester</option>
              <option value="5th Semester" selected>5th Semester</option>
              <option value="6th Semester">6th Semester</option>
              <option value="7th Semester">7th Semester</option>
              <option value="8th Semester">8th Semester</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Student Account 🚀
        </button>
      </form>

      <div class="form-footer">
        Already registered? <a href="login.html" style="font-weight: 600;">Sign In here</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Route guard: if already logged in, redirect to dashboard
    checkAuthGuard(false);

    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const branch = document.getElementById('branch').value;
      const semester = document.getElementById('semester').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please verify and re-enter.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering Account...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            branch,
            semester,
            password,
            confirmPassword
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Registration successful! Redirecting to Dashboard...', 'success');
          setAuth(data.token, data.user);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showAlert(data.message || 'Registration failed. Please check your inputs.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Student Account 🚀';
        }
      } catch (err) {
        console.error(err);
        showAlert('Unable to connect to the server. Please ensure the backend is running.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Student Account 🚀';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
